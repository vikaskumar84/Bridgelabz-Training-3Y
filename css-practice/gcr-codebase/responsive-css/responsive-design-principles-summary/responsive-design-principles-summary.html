<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="responsive-design-principles-summary.css" />
  </head>
  <body>
    <header><h1>Responsive Design Principles</h1></header>
    <main class="ideas">
      <article>
        <h2>Fluid Layouts</h2>
        <p>Layouts use flexible sizes instead of fixed widths.</p>
        <code>width: 100%;</code>
      </article>
      <article>
        <h2>Flexible Media</h2>
        <p>Images and videos resize within their containers.</p>
        <code>max-width: 100%;</code>
      </article>
      <article>
        <h2>Breakpoints</h2>
        <p>Styles change according to screen width.</p>
        <code>@media (max-width: 600px)</code>
      </article>
    </main>
  </body>
</html>
