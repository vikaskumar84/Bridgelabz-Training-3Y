<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css" />
  </head>
  <body>
    <header><h1>Filter Comparison</h1></header>
    <main class="compare">
      <figure>
        <img src="https://picsum.photos/id/1011/700/450" alt="Original landscape" />
        <figcaption>Before: Original Image</figcaption>
      </figure>
      <figure>
        <img
          class="edited"
          src="https://picsum.photos/id/1011/700/450"
          alt="Filtered landscape"
        />
        <figcaption>After: Filtered Image</figcaption>
      </figure>
    </main>
  </body>
</html>
