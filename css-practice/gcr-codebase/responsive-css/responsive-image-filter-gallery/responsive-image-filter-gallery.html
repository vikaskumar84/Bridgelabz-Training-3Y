<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css" />
  </head>
  <body>
    <header><h1>Responsive Image Filter Gallery</h1></header>
    <main class="photo-grid">
      <figure>
        <img
          class="soft"
          src="https://picsum.photos/id/1015/600/400"
          alt="Mountain landscape"
        />
        <figcaption>Blur Filter</figcaption>
      </figure>
      <figure>
        <img
          class="mono"
          src="https://picsum.photos/id/1016/600/400"
          alt="Forest landscape"
        />
        <figcaption>Grayscale Filter</figcaption>
      </figure>
      <figure>
        <img
          class="vintage"
          src="https://picsum.photos/id/1018/600/400"
          alt="River landscape"
        />
        <figcaption>Sepia Filter</figcaption>
      </figure>
      <figure>
        <img
          class="bright"
          src="https://picsum.photos/id/1020/600/400"
          alt="Nature scene"
        />
        <figcaption>Brightness Filter</figcaption>
      </figure>
      <figure>
        <img
          class="punchy"
          src="https://picsum.photos/id/1024/600/400"
          alt="Animal portrait"
        />
        <figcaption>Contrast Filter</figcaption>
      </figure>
      <figure>
        <img
          class="tinted"
          src="https://picsum.photos/id/1025/600/400"
          alt="Dog portrait"
        />
        <figcaption>Hue Rotate Filter</figcaption>
      </figure>
    </main>
    <footer><p>Responsive CSS Assignment 9</p></footer>
  </body>
</html>
