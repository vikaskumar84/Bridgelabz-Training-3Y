<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="panel">
    <h1>Quick Finder</h1>
    <label for="query">Search</label>
    <input id="query" type="search" placeholder="Type a keyword">
    <label for="topic">Topic</label>
    <select id="topic">
      <option>HTML</option>
      <option>CSS</option>
      <option>Flexbox</option>
      <option>Grid</option>
    </select>
    <div class="buttons">
      <button type="button" class="go">Search</button>
      <button type="button" class="clear">Clear</button>
    </div>
  </main>
</body>
</html>
