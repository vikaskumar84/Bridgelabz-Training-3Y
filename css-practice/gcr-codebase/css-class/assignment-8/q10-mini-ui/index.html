<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Study Planner</h1>
  </header>
  <main class="wrap">
    <section class="box">
      <img src="https://picsum.photos/seed/desk/200/140" alt="Desk with books and laptop">
      <div class="info">
        <h2>Plan Your Session</h2>
        <p>Note down what you want to practise next.</p>
        <form>
          <label for="topic">Topic</label>
          <input id="topic" type="text" placeholder="e.g. Flexbox">
          <label for="mail">Email</label>
          <input id="mail" type="email" placeholder="you@example.com">
          <div class="btn-row">
            <button type="submit" class="save">Save</button>
            <button type="reset" class="reset">Reset</button>
          </div>
        </form>
      </div>
    </section>
  </main>
  <footer>
    <p>Compact Flexbox layout with a form, buttons and an image.</p>
  </footer>
</body>
</html>
