<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Image Showcase</h1>
  </header>
  <main class="grid">
    <figure>
      <div class="frame"><img src="https://picsum.photos/seed/woods/500/340" alt="Misty Woods"></div>
      <figcaption>Misty Woods</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="https://picsum.photos/seed/building/500/340" alt="Old Building"></div>
      <figcaption>Old Building</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="https://picsum.photos/seed/peaks/500/340" alt="Snow Peaks"></div>
      <figcaption>Snow Peaks</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="https://picsum.photos/seed/city/500/340" alt="Night City"></div>
      <figcaption>Night City</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="https://picsum.photos/seed/sea/500/340" alt="Calm Sea"></div>
      <figcaption>Calm Sea</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="https://picsum.photos/seed/valley/500/340" alt="Green Valley"></div>
      <figcaption>Green Valley</figcaption>
    </figure>
  </main>
  <footer>
    <p>Six images in a responsive grid.</p>
  </footer>
</body>
</html>
