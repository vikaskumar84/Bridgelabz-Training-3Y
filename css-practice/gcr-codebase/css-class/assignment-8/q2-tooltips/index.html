<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hover For Tooltips</h1>
  </header>
  <main class="stage">
    <div class="term">HTML
      <span class="tip">Builds the page structure</span>
    </div>
    <div class="term">CSS
      <span class="tip">Controls how it looks</span>
    </div>
    <div class="term">Flexbox
      <span class="tip">One-dimensional layouts</span>
    </div>
    <div class="term">Grid
      <span class="tip">Two-dimensional layouts</span>
    </div>
  </main>
  <footer>
    <p>Move the pointer over a word to read its tooltip.</p>
  </footer>
</body>
</html>
