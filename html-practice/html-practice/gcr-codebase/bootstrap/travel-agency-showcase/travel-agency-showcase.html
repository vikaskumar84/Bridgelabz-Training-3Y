<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WanderWorld - Travel Agency</title>
    <!-- Bootstrap 5 CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="travel-agency-showcase.css" />
  </head>
  <body>
    <header class="py-4 bg-dark text-white">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">WanderWorld</h1>
        <span>Travel &bull; Explore &bull; Discover</span>
      </div>
    </header>

    <main>
      <!-- data-bs-ride starts the slideshow; data-bs-interval on each slide sets its delay (ms) -->
      <div id="destinationSlider" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active" data-bs-interval="2500">
            <img
              src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80"
              class="d-block w-100"
              alt="Bali"
            />
            <div class="carousel-caption">
              <h2>Bali</h2>
              <p>Unwind on quiet tropical beaches.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="3000">
            <img
              src="https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=1600&q=80"
              class="d-block w-100"
              alt="Switzerland"
            />
            <div class="carousel-caption">
              <h2>Switzerland</h2>
              <p>Take in snow-capped mountain views.</p>
            </div>
          </div>
          <div class="carousel-item" data-bs-interval="3500">
            <img
              src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=1600&q=80"
              class="d-block w-100"
              alt="Agra"
            />
            <div class="carousel-caption">
              <h2>Agra</h2>
              <p>Walk through centuries of history.</p>
            </div>
          </div>
        </div>
        <button
          class="carousel-control-prev"
          type="button"
          data-bs-target="#destinationSlider"
          data-bs-slide="prev"
        >
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button
          class="carousel-control-next"
          type="button"
          data-bs-target="#destinationSlider"
          data-bs-slide="next"
        >
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>

      <section class="container py-5">
        <h2>Booking Progress</h2>
        <!-- striped + animated gives the moving stripes; width sets the percentage -->
        <div
          class="progress"
          role="progressbar"
          aria-label="Booking progress"
          aria-valuenow="70"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 70%">70%</div>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white text-center p-4">
      <p class="mb-0">Contact: hello@wanderworld.example | +91 98765 43210</p>
    </footer>
    <!-- Bootstrap JS bundle: needed for navbar toggle, alerts and carousel -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
