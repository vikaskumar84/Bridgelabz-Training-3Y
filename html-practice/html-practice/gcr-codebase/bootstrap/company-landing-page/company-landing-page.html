<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrightByte - Company Landing Page</title>
    <!-- Bootstrap 5 CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="company-landing-page.css" />
  </head>
  <body>
    <header>
      <!-- navbar-expand-lg: collapses into a toggle button below 992px -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand fw-bold" href="#">BrightByte</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <!-- ms-auto pushes the links to the right -->
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
              <li class="nav-item"><a class="nav-link" href="#">About</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero py-5">
        <!-- container > row > col is the basic Bootstrap grid -->
        <div class="container">
          <div class="row align-items-center g-4">
            <div class="col-lg-7">
              <span class="badge text-bg-primary mb-3">Plan. Build. Grow.</span>
              <h1 class="display-4 fw-bold">Software that helps small teams move faster.</h1>
              <p class="lead">
                We design apps, automate repetitive work and turn rough ideas into working products.
              </p>
              <a href="#" class="btn btn-primary btn-lg">Get Started</a>
            </div>
            <div class="col-lg-5">
              <img
                class="img-fluid rounded-4 shadow"
                src="https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=900&q=80"
                alt="Team working together at a table"
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-dark text-white text-center p-4">
      <p class="mb-0">&copy; 2026 BrightByte. All rights reserved.</p>
    </footer>
    <!-- Bootstrap JS bundle: needed for navbar toggle, alerts and carousel -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
