<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dev Chauhan - Portfolio</title>
    <!-- Bootstrap 5 CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="personal-portfolio-basics.css" />
  </head>
  <body>
    <!-- p-5: large padding, text-center: centred text, bg-light: light grey background -->
    <header class="p-5 text-center bg-light text-dark">
      <div class="container">
        <!-- img-fluid keeps the image responsive, rounded-circle makes it round -->
        <img
          src="https://i.pravatar.cc/220?img=15"
          class="img-fluid rounded-circle profile-pic mb-4"
          alt="Profile photo of Dev Chauhan"
        />
        <h1 class="fw-bold">Dev Chauhan</h1>
        <p class="lead">Computer Science student who likes building web projects</p>
        <a class="btn btn-primary me-2" href="#">Hire Me</a>
        <a class="btn btn-outline-dark" href="#">Download CV</a>
      </div>
    </header>

    <main>
      <section class="container text-center mt-4 mb-3 pb-5">
        <h2 class="fw-bold mb-3">About Me</h2>
        <p>I enjoy making responsive websites and solving programming problems in Java and JavaScript.</p>

        <div class="row justify-content-center mt-4">
          <div class="col-md-7">
            <!-- form-control gives full-width, styled inputs -->
            <form class="bg-white p-4 rounded shadow-sm">
              <input class="form-control mb-3" type="text" placeholder="Your name" aria-label="Your name" />
              <input
                class="form-control mb-3"
                type="email"
                placeholder="Email address"
                aria-label="Email address"
              />
              <textarea
                class="form-control mb-3"
                rows="4"
                placeholder="Your message"
                aria-label="Your message"
              ></textarea>
              <button type="submit" class="btn btn-primary w-100">Send Message</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="text-center p-3 bg-dark text-white">
      <p class="mb-0">&copy; 2026 Dev Chauhan</p>
    </footer>
  </body>
</html>
