<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TechPulse - Blog</title>
    <!-- Bootstrap 5 CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Google Font used for the theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="custom-themed-blog-homepage.css" />
  </head>
  <body>
    <header class="py-5 text-center theme-header">
      <div class="container">
        <h1 class="fw-bold">TechPulse</h1>
        <p class="lead">Notes on code, tools and technology.</p>
      </div>
    </header>

    <main class="container pb-5">
      <div class="row g-4">
        <div class="col-md-6">
          <article class="card h-100 shadow-sm">
            <img
              src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80"
              class="card-img-top"
              alt="Technology"
            />
            <div class="card-body">
              <h2 class="h4">The Future of Web Development</h2>
              <p>See how modern tools are changing the way sites get built.</p>
              <button type="button" class="btn btn-primary">Read More</button>
            </div>
          </article>
        </div>
        <div class="col-md-6">
          <article class="card h-100 shadow-sm">
            <img
              src="https://images.unsplash.com/photo-1555949963-ff9fe0c870eb?auto=format&fit=crop&w=900&q=80"
              class="card-img-top"
              alt="Coding"
            />
            <div class="card-body">
              <h2 class="h4">Why Clean Code Matters</h2>
              <p>Readable code is easier to fix, extend and hand over to a teammate.</p>
              <button type="button" class="btn btn-primary">Read More</button>
            </div>
          </article>
        </div>
      </div>
    </main>

    <footer class="text-center py-4">
      <p class="mb-0">&copy; 2026 TechPulse Blog</p>
    </footer>
  </body>
</html>
