<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog - Pagination</title>
    <!-- Bootstrap 5 CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="blog-pagination-and-pager.css" />
  </head>
  <body>
    <main class="container py-5">
      <h1 class="text-center mb-5">Latest Blog Posts</h1>

      <div class="row g-4">
        <div class="col-md-6">
          <article class="card h-100">
            <div class="card-body">
              <h2 class="h4">Getting Started with Bootstrap</h2>
              <p>A quick tour of containers, rows and columns for first-time users.</p>
            </div>
          </article>
        </div>
        <div class="col-md-6">
          <article class="card h-100">
            <div class="card-body">
              <h2 class="h4">Building Responsive Interfaces</h2>
              <p>How breakpoints and utility classes keep a page tidy on any screen.</p>
            </div>
          </article>
        </div>
      </div>

      <nav class="mt-5" aria-label="Blog pages">
        <!-- justify-content-center centres the pagination -->
        <ul class="pagination justify-content-center">
          <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
          <li class="page-item active"><a class="page-link" href="#">1</a></li>
          <li class="page-item"><a class="page-link" href="#">2</a></li>
          <li class="page-item"><a class="page-link" href="#">Next</a></li>
        </ul>
      </nav>

      <!-- Simple pager built with outline buttons and gap spacing -->
      <div class="d-flex justify-content-center gap-2 mt-4">
        <button type="button" class="btn btn-outline-secondary">Older Posts</button>
        <button type="button" class="btn btn-outline-secondary">Newer Posts</button>
      </div>
    </main>
  </body>
</html>
